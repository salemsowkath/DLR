version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: dlr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dlr_database}
      POSTGRES_USER: ${POSTGRES_USER:-dlr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the optional database service}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dlr_user} -d ${POSTGRES_DB:-dlr}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
